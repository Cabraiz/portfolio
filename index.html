      /* HTML pré-renderizado (para buscadores e IAs): escondido até o React
         montar, que substitui o conteúdo da raiz. Sem JavaScript, aparece. */
      #root[data-prerendered] {
        visibility: hidden;
      }
    </style>
    <noscript>
      <style>
        #root[data-prerendered] {
          visibility: visible;
        }
      </style>
    </noscript>

    <!-- Script de roteamento para GitHub Pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
