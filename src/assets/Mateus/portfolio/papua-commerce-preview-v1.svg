<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Preview do e-commerce em Papua-Nova Guiné</title>
  <desc id="desc">Interface de uma loja virtual com produtos, busca, carrinho e preços em kina.</desc>
  <defs>
