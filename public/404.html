<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <title>Cabraiz</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #050505;
      }

      body {
        visibility: hidden;
      }
    </style>
    <script>
      (function redirectGithubPagesRoute(location) {
        var pathname = decodeURIComponent(location.pathname).replace(/\/+$/, "");

        if (pathname === "/resume") {
          location.replace("/files/mateus-cabral-resume.pdf");
          return;
        }

        var route =
          location.pathname
            .slice(1)
            .split("/")
            .join("/")
            .replace(/&/g, "~and~") +
          (location.search
            ? "&" + location.search.slice(1).replace(/&/g, "~and~")
            : "") +
          location.hash;

        location.replace(location.origin + "/?/" + route);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
