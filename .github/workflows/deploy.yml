name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [produção]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup project npm version
        run: npm install --global npm@12.1.0

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build app
        run: npx vite build && node scripts/prepare-github-pages.mjs
        env:
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL }}

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🧪 Verify navigation and viewport contracts
        run: npm run test:e2e:landing
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"

      - name: Verify section state after cooldown
        run: npx playwright test --config playwright.section-state.config.ts

      - name: 📤 Upload static site to artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: 🚀 Deploy to GitHub Pages

    steps:
      - name: 🚀 Deploy with GitHub Pages
        uses: actions/deploy-pages@v5.0.1
